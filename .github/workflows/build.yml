name: 装修客户管家 ZIP 自动编译 - 长期签名
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 解压当前唯一安卓源码ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' zips < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)
          if (( ${#zips[@]} != 1 )); then echo '仓库根目录必须恰有一个安卓源码 ZIP' >&2;exit 1; fi
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/source"
          path="$(find "$RUNNER_TEMP/source" -type f -path '*/app/build.gradle' -print -quit)"
          if [[ -z "$path" ]]; then echo '没有找到安卓工程' >&2;exit 1;fi
          project="${path%/app/build.gradle}"
          [[ -f "$project/settings.gradle" ]] || { echo '项目根目录不完整' >&2;exit 1; }
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: 安装SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: 回归检查
        shell: bash
        run: |
          set -euo pipefail
          for name in verify_project.py verify_v104.py verify_ux.py verify_navigation.py verify_commission.py verify_month_filter.py; do python3 "$PROJECT_DIR/tools/$name"; done
      - name: 先编译 Debug 检查所有源码
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - name: 装载独立保管的长期签名私钥
        env:
          KEY_BASE64: ${{ secrets.CLIENTKEEPER_KEYSTORE_B64 }}
          CLIENTKEEPER_KEYSTORE_PASSWORD: ${{ secrets.CLIENTKEEPER_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_BASE64" || -z "$CLIENTKEEPER_KEYSTORE_PASSWORD" ]]; then
            echo '请先设置GitHub Actions Secrets：CLIENTKEEPER_KEYSTORE_B64和CLIENTKEEPER_KEYSTORE_PASSWORD' >&2
            exit 1
          fi
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/clientkeeper.jks"
          echo "CLIENTKEEPER_KEYSTORE_FILE=$RUNNER_TEMP/clientkeeper.jks" >> "$GITHUB_ENV"
      - name: 编译稳定签名 APK
        env:
          CLIENTKEEPER_KEYSTORE_PASSWORD: ${{ secrets.CLIENTKEEPER_KEYSTORE_PASSWORD }}
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: 装修客户管家-V1.0.4-稳定签名APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error