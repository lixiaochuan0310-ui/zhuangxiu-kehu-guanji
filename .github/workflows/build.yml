name: 装修客户管家 ZIP 自动编译

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 解压仓库中的安卓源码 ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo '仓库根目录没有找到 ZIP 源码文件' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/client-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/client-source"
          project_dir="$(find "$RUNNER_TEMP/client-source" -type f -path '*/app/build.gradle' -print -quit | sed 's@/app/build.gradle$@@')"
          if [[ -z "$project_dir" || ! -f "$project_dir/settings.gradle" ]]; then
            echo 'ZIP 内没有找到完整安卓工程' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 35 编译环境
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: 检查源码
        shell: bash
        run: python3 "$PROJECT_DIR/tools/verify_project.py"

      - name: 编译 Debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 装修客户管家-V1.0-安装包
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
